<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usage Stats</title>
<style>
:root{
  --bg:#fcfcfb; --panel:#fff; --panel-2:#f7f7f5; --panel-3:#f1f1ee;
  --line:#e4e3df; --line-2:#efeeea;
  --txt:#1b1b19; --dim:#67655f; --faint:#9d9b94;
  --blue:#1d4ed8; --green:#15803d; --amber:#b45309; --red:#b91c1c;
  --skill-f:#92400e; --cmd-f:#6d28d9; --agent-f:#be185d;
  --rule-f:#155e75; --tool-f:#1d4ed8; --mcp-f:#15803d; --plugin-f:#b45309;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--txt);font-family:ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:#dbeafe}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:26px;padding:0 18px;height:56px}
.logo{font-weight:700;font-size:15px;color:var(--blue);letter-spacing:-.03em;white-space:nowrap}
.nav{display:flex;gap:2px;margin-left:6px}
.nav a{font-size:11px;color:var(--dim);padding:4px 9px;border-radius:5px}
.nav a:hover{background:var(--panel-2);color:var(--txt)}
.nav a.on{background:#eff5ff;color:var(--blue);font-weight:600}
.gen{margin-left:auto;font-size:10px;color:var(--faint)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font-size:10px;padding:4px 9px;color:var(--dim)}
.seg button:hover{background:var(--panel-2)}
.seg button.on{background:#eff5ff;color:var(--blue);font-weight:600}
.live{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px}
.live::before{content:'';width:6px;height:6px;border-radius:50%;background:#16a34a;animation:p 2s infinite}
.live.err::before{background:var(--red);animation:none}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}

main{max-width:1180px;margin:0 auto;padding:26px 22px 90px}

/* ---------- staggered load ---------- */
.fade{animation:f .4s cubic-bezier(.2,.7,.3,1) both}
@keyframes f{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}
.hs{background:#fff;padding:18px 20px 16px}
.hs .l{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.hs .n{font-size:31px;font-weight:650;letter-spacing:-.045em;font-variant-numeric:tabular-nums;line-height:1.05}
.hs .n small{font-size:15px;font-weight:500;color:var(--dim);letter-spacing:-.02em}
.hs .d{font-size:9.5px;color:var(--faint);margin-top:5px}
.hs .n.cost{color:var(--amber)}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 18px;margin-bottom:16px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.pt{font-size:12px;font-weight:600;letter-spacing:-.01em}
.psub{font-size:10px;color:var(--faint)}

/* ---------- area chart ---------- */
.chart{position:relative}
.chart svg{display:block;width:100%;height:170px}
.ax{display:flex;justify-content:space-between;font-size:9px;color:var(--faint);margin-top:5px}
.ch-tip{position:fixed;z-index:40;background:#1c1917;color:#e7e5e4;border-radius:7px;padding:7px 11px;font-size:11px;pointer-events:none;transform:translate(-50%,-100%) translateY(-12px);box-shadow:0 8px 24px rgba(28,25,23,.28);white-space:nowrap}
.ch-tip .tt-t{font-weight:600;margin-bottom:2px}
.ch-tip .tt-s{color:#a8a29e;font-size:10px}

/* ---------- ranked columns ---------- */
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.rk{display:grid;grid-template-columns:18px minmax(0,1fr) 44px 56px;gap:8px;align-items:center;padding:7px 8px;border-radius:6px;transition:transform .12s,background .12s}
.rk:hover{background:var(--panel-2);transform:translateY(-1px)}
.rk .i{font-size:9.5px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
.rk .body{min-width:0}
.rk .nm{font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.rk .sub{display:flex;align-items:center;gap:7px;margin-top:3px}
.rk .bar{flex:1;height:3px;background:#eceae5;border-radius:2px;overflow:hidden}
.rk .bar i{display:block;height:100%;border-radius:2px}
.rk .ls{font-size:9px;color:var(--faint);white-space:nowrap;flex:none}
.rk .ct{font-size:12px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.rk .ct small{font-size:9px;color:var(--faint);font-weight:400;display:block;line-height:1.2}
.rk svg{display:block}
.col .ph{margin-bottom:8px}
.k-skill .bar i{background:var(--skill-f)} .k-skill .pt{color:var(--skill-f)}
.k-cmd .bar i{background:var(--cmd-f)} .k-cmd .pt{color:var(--cmd-f)}
.k-agent .bar i{background:var(--agent-f)} .k-agent .pt{color:var(--agent-f)}
.k-rule .bar i{background:var(--rule-f)} .k-rule .pt{color:var(--rule-f)}
.k-tool .bar i{background:var(--tool-f)} .k-tool .pt{color:var(--tool-f)}
.k-mcp .bar i{background:var(--mcp-f)} .k-mcp .pt{color:var(--mcp-f)}
.k-plugin .bar i{background:var(--plugin-f)} .k-plugin .pt{color:var(--plugin-f)}
.empty{font-size:10.5px;color:var(--faint);padding:14px 6px}

/* ---------- models footer ---------- */
.models{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.mchip{display:flex;align-items:baseline;gap:7px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;font-size:10.5px}
.mchip .mn{font-weight:600;letter-spacing:-.01em}
.mchip .mt{color:var(--dim);font-variant-numeric:tabular-nums}
.mchip .mc{color:var(--faint);font-size:9.5px;font-variant-numeric:tabular-nums}

/* ---------- states ---------- */
.state{padding:80px 20px;text-align:center;color:var(--dim);font-size:12px}
.state .big-msg{font-size:15px;font-weight:600;color:var(--txt);margin-bottom:6px}
.state button{color:var(--blue);text-decoration:underline;text-underline-offset:2px;margin-top:8px}
.banner{background:#fee2e2;border:1px solid #f6bcbc;color:var(--red);border-radius:5px;padding:6px 10px;font-size:11px;margin-bottom:14px}

@media(max-width:960px){.hero{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/stats.js"></script>
</body>
</html>
